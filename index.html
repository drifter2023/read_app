<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      // Night theme before first paint (src/app/theme.ts keeps this key in sync with the setting).
      try { if (localStorage.getItem('spotlight-theme') === 'night') { document.documentElement.dataset.theme = 'night'; document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0c0f'); } } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spotlight" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Spotlight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
