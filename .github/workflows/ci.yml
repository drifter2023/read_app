name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache dictionary sources
        uses: actions/cache@v4
        with:
          path: .cache/dict
          key: dict-${{ hashFiles('scripts/build-dict.ts') }}
          restore-keys: dict-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium

      - run: npm run build

      - run: npm test

      - run: npm run e2e

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
          if-no-files-found: error

  preview:
    name: Preview
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Check dist layout
        run: test -f dist/index.html

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" \
            2>&1 | tee preview.txt
          sed -E -i 's/\x1b\[[0-9;]*m//g' preview.txt
          url="$(grep -Eo "https://pr-${{ github.event.pull_request.number }}-spotlight-reader[^[:space:]]+" preview.txt | head -n 1 || true)"
          if [ -z "${url}" ]; then
            url="https://pr-${{ github.event.pull_request.number }}-spotlight-reader.ai-core.workers.dev"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="<!-- spotlight-preview -->"
          body="$(printf '%s\n\nPreview (does not change https://spotlight-reader.ai-core.workers.dev): %s\n' "$marker" "$PREVIEW_URL")"
          ids="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id")"
          id="${ids%%$'\n'*}"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="${body}"
          else
            gh pr comment "${PR_NUMBER}" --body "${body}"
          fi
